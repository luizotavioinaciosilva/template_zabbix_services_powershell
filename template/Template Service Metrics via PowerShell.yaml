        - macro: '{$SERVICE.NET.TIME.PERIOD}'
          value: 5m
          description: 'Janela de tempo para cálculo da média móvel de tráfego de rede.'
        - macro: '{$SERVICE.THREADS.MAX}'
          value: '1000'
          description: 'Limite máximo de Threads ativas no processo.'
        - macro: '{$SERVICE.THREADS.RECOV}'
          description: 'Valor para fechamento do alerta de excesso de Threads (Histérese).'
        - macro: '{$SERVICE.UPTIME.MIN}'
