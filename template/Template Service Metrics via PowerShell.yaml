        - macro: '{$SERVICE.CPU.RECOV.PCT}'
          value: '60'
          description: 'Valor percentual para fechamento do alerta de CPU (Histérese).'
        - macro: '{$SERVICE.CPU.TIME.PERIOD}'
          value: 5m
          description: 'Período de avaliação (janela de tempo) para a média móvel de CPU.'
        - macro: '{$SERVICE.DISK.MAX.OPS}'
          value: '500'
          description: 'Limite máximo de operações de disco por segundo (Read/Write Ops).'
        - macro: '{$SERVICE.DISK.RECOV.OPS}'
          value: '400'
          description: 'Valor para recuperação do alerta de operações de disco (80% do limite).'
        - macro: '{$SERVICE.DISK.TIME.PERIOD}'
          value: 5m
          description: 'JJanela de tempo para cálculo da média móvel de IOPS de disco.'
        - macro: '{$SERVICE.HANDLES.MAX}'
          description: 'Limite máximo de Handles abertos pelo processo.'
        - macro: '{$SERVICE.HANDLES.RECOV}'
          description: 'Valor para fechamento do alerta de excesso de Handles (Histérese).'
        - macro: '{$SERVICE.MEM.MAX.BYTES}'
          value: '104857600'
          description: 'Limite máximo de RAM em BYTES. (Ex: 16GB = 17179869184).'
        - macro: '{$SERVICE.MEM.MAX.MB}'
          value: '100'
          description: 'Representação amigável em MB do limite de RAM (usada apenas no nome da Trigger).'
        - macro: '{$SERVICE.MEM.RECOV.BYTES}'
          value: '83886080'
          description: 'Limite de recuperação de RAM em BYTES para fechamento do alerta.'
        - macro: '{$SERVICE.NET.MAX.BYTES}'
